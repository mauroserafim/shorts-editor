name: Testar IA

on:
  workflow_dispatch: {}

permissions:
  contents: read
  models: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -L -i -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Diga oi em JSON: {\"msg\": ...}"}]}' | head -c 1500
          echo
          env | grep -i -E "proxy" || echo "sem proxy"
