name: Testar IA reserva (Groq)
on:
  workflow_dispatch: {}
  push:
    paths: [".test-ia"]
permissions:
  contents: read
  models: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests Pillow json-repair
      - run: python -m tools.test_ia
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
