name: Testar IA reserva
on:
  workflow_dispatch: {}
  push:
    paths: [".test-ia"]
permissions:
  contents: read
  models: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests
      - run: python tools/test_ia.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
