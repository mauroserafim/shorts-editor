name: Editar Shorts

on:
  schedule:
    - cron: "*/15 * * * *"   # confere a pasta a cada 15 min
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora
  push:
    paths: [".trigger"]       # o Claude dispara a edição na hora mudando este arquivo

permissions:
  contents: read
  models: read   # IA grátis do GitHub (título + escolha dos b-rolls)

concurrency:
  group: editar-shorts
  cancel-in-progress: false

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
  RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID || '1p7t0C2w6xKwEXuP6XcB8HMo69PS6-jO4' }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  CAP_STYLE: ${{ vars.CAP_STYLE }}
  SHOW_TITLE: ${{ vars.SHOW_TITLE }}
  WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'medium' }}
  CAPTION_FONT: Montserrat ExtraBold

jobs:
  editar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Tem vídeo novo?
        id: check
        run: python -m editor.main --check

      - name: Instalar ffmpeg e fontes
        if: steps.check.outputs.pending == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat
          fc-list | grep -i montserrat | head -3

      - name: Cache do modelo Whisper
        if: steps.check.outputs.pending == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'medium' }}

      - name: Instalar Python libs
        if: steps.check.outputs.pending == 'true'
        run: pip install -q -r requirements.txt

      - name: Editar e subir para "Prontos"
        if: steps.check.outputs.pending == 'true'
        run: python -m editor.main
